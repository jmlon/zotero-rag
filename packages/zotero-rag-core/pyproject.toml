[project]
name = "zotero-rag-core"
version = "0.5.1"
description = "Indexing and cited question answering over a Zotero library: the library behind zotero-rag"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.28",
    "langchain-core>=1.5.1",
    "langchain-openai>=1.4.1",
    "langchain-text-splitters>=1.1.2",
    "openai>=2",
    "pydantic>=2.13.4",
    "pypdf>=6.14.2",
    "pyyaml>=6.0.3",
    "pyzotero>=1.13.2",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.13.0",
]

[project.optional-dependencies]
# The persistent Chroma store the CLI keeps in each index folder.
chroma = ["chromadb>=1.5.9"]
# A shared PostgreSQL store with pgvector, for a hosted deployment.
pgvector = ["psycopg[binary]>=3.2", "psycopg-pool>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zotero_rag_core"]
