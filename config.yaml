# Project-level defaults. Layered on top of the packaged defaults
# (src/zotero_rag/data/config.yaml) whenever a command runs from this directory.
# `init` copies the packaged version into a new index folder.
global:
    # Only the NAMES of the environment variables are stored here; the values are
    # resolved from the environment (or a .env file) at load time.
    endpoint_env: OPENROUTER_ENDPOINT
    api_key_env: OPENROUTER_API_KEY
    zotero_library_id_env: ZOTERO_LIBRARY_ID
    zotero_api_key_env: ZOTERO_API_KEY
    zotero_library_type: user
    defaults:
        llm_model: openai/gpt-6-luna
        embedding_model: openai/text-embedding-3-small
        vector_db: chroma
        reranker: null

index:
    # Pinned by the first `index` run; null in a freshly initialized folder.
    collection_path: null
    collection_key: null
    collection_name: null
    recursive: true

    chunk_size: 1000 # characters
    chunk_overlap: 200 # characters
    top_k: 10
    temperature: 0.0

    # null => inherit from global.defaults
    llm_model: null
    embedding_model: null
    vector_db: null


embedding_models:
  - id: "perplexity/pplx-embed-v1-0.6b"
    provider: "Perplexity"
    dimensions: 384
    context_window: 32000
    pricing:
      currency: "USD"
      unit: "per_1M_tokens"
      input: 0.004
    notes: "Ultra-low budget vector baseline for extremely fast retrieval."

  - id: "qwen/qwen3-embedding-8b"
    provider: "Alibaba"
    dimensions: 4096
    context_window: 32768
    pricing:
      currency: "USD"
      unit: "per_1M_tokens"
      input: 0.01
    notes: "State-of-the-art open weight model with massive context window and high dimensionality."

  - id: "baai/bge-m3"
    provider: "BAAI"
    dimensions: 1024
    context_window: 8192
    pricing:
      currency: "USD"
      unit: "per_1M_tokens"
      input: 0.01
    notes: "Top-tier open-source multilingual embedding optimized for complex multi-lingual RAG."

  - id: "openai/text-embedding-3-small"
    provider: "OpenAI"
    dimensions: 1536
    context_window: 8191
    pricing:
      currency: "USD"
      unit: "per_1M_tokens"
      input: 0.02
    notes: "Highly reliable industry default for general English semantic search."

  - id: "amazon/titan-embed-text-v2"
    provider: "Amazon"
    dimensions: 1024
    context_window: 8192
    pricing:
      currency: "USD"
      unit: "per_1M_tokens"
      input: 0.02
    notes: "Flexible text embedding allowing configurable dimension downscaling (512 or 256)."

  - id: "voyageai/voyage-4"
    provider: "Voyage AI"
    dimensions: 1024
    context_window: 32000
    pricing:
      currency: "USD"
      unit: "per_1M_tokens"
      input: 0.06
    notes: "Excellent retrieval accuracy paired with an expansive 32k context size."

  - id: "google/gemini-embedding-001"
    provider: "Google"
    dimensions: 768
    context_window: 20000
    pricing:
      currency: "USD"
      unit: "per_1M_tokens"
      input: 0.15
    notes: "Google legacy baseline text vector model."

  - id: "nvidia/nemotron-3.5-embed-1b:free"
    provider: "NVIDIA"
    dimensions: 1024
    context_window: 32768
    pricing:
      currency: "USD"
      unit: "per_1M_tokens"
      input: 0.00
    notes: "Rate-limited, free-tier multimodal and text model on OpenRouter."
