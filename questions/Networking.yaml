          - the objective is to minimize the total power consumption of active switch
            nodes and link ports
          - >-
              it satisfies three constraints: demand completion, link capacity with a
              dynamic safety margin based on prediction confidence, and flow conservation
          - the decision version of the problem, DMCF, is proved NP-hard
          - the proof is a mathematical reduction from the classic 0-1 knapsack problem to
