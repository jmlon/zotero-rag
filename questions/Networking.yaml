      answer: |-
          The authors formulate the bandwidth allocation and routing optimization as a
          **Multi-Commodity Flow (MCF)** problem, modeled as an Integer Linear Programming
          (ILP) problem. The objective is to minimize the total power consumption of
          active switch nodes and link ports while strictly satisfying three constraints:
          demand completion, link capacity constraints (incorporating a dynamic safety
          margin based on prediction confidence), and flow conservation. The authors prove
          that the decision version of this problem (DMCF) is **NP-hard** by providing a
          mathematical reduction from the classic 0–1 knapsack problem to an instance of
          the DMCF problem.

