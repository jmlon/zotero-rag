          - this results in low average link utilization, between 5% and 25%, and
            significant energy waste from idle or low-loaded network devices
          - >-
              the first part is flow prediction: a Long Short-Term Memory (LSTM) neural
              network predicts short-term network flow demands for the next time window
          - >-
              the second part is traffic optimization: a Deep Reinforcement Learning
              approach, a tailored Deep Deterministic Policy Gradient (DDPG) algorithm,
              solves bandwidth allocation and routing optimization dynamically
          - this lets the system power off or put unused switches, ports or linecards into
            sleep mode to save energy
      answer: |-
          The primary problem is that DCNs are typically over-provisioned to handle peak
          workloads and traffic bursts, resulting in low average link utilization (between
          5% and 25%) and significant energy waste from idle or low-loaded network
          devices. To solve this, the authors propose an intelligent, two-part framework:
          1. **Flow Prediction:** A Long Short-Term Memory (LSTM) neural network is used
             to predict short-term network flow demands for the next time window.
          2. **Traffic Optimization:** A Deep Reinforcement Learning (DRL) approach,
             specifically a tailored Deep Deterministic Policy Gradient (DDPG) algorithm,
             is used to solve the bandwidth allocation and routing optimization problem
             dynamically. This allows the system to power off or put unused switches,
             ports, or linecards into sleep mode to save energy.

