[project]
name = "zotero-rag"
version = "0.4.0"
description = "CLI for indexing and querying a Zotero library using RAG"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "chromadb>=1.5.9",
    # Imported directly to catch transport errors pyzotero lets through.
    "httpx>=0.28",
    "langchain-core>=1.5.1",
    "langchain-openai>=1.4.1",
    "langchain-text-splitters>=1.1.2",
    "pinecone>=9.1.0",
    "pydantic>=2.13.4",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "pyzotero>=1.13.2",
    "rich>=15.0.0",
    "tiktoken>=0.13.0",
    "typer>=0.27.0",
]

[project.scripts]
zotero-rag = "zotero_rag.cli:app"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zotero_rag"]

[tool.uv]
# Ensures uv uses src layout
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
