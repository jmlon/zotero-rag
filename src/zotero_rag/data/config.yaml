global:
    # Only the NAMES of the environment variables are stored here; the values are
    # resolved from the environment (or a .env file) at load time.
    endpoint_env: OPENROUTER_ENDPOINT
    api_key_env: OPENROUTER_API_KEY
    zotero_library_id_env: ZOTERO_LIBRARY_ID
    zotero_api_key_env: ZOTERO_API_KEY
    # Only needed if you enable a reranker below. Cohere is a separate provider
    # because OpenRouter proxies chat and embeddings, but not reranking.
    cohere_api_key_env: COHERE_API_KEY
    # Optional, for `convert --ocr hosted`, which sends scanned PDF pages to
    # Firecrawl Parse. It works without a key, at lower limits.
    firecrawl_api_key_env: FIRECRAWL_API_KEY
    zotero_library_type: user
    defaults:
        llm_model: openai/gpt-4o-mini
        embedding_model: openai/text-embedding-3-small
        vector_db: chroma
        # null | cohere. Inherited by the index unless it sets its own.
        reranker: null

index:
    # Pinned by the first `index` run; null in a freshly initialized folder.
    collection_path: null
    collection_key: null
    collection_name: null
    recursive: true

    chunk_size: 1000 # characters
    chunk_overlap: 200 # characters
    # Passages retrieved per question. 10 rather than 5 because every measured metric
    # improved — mean score 1.81 -> 2.38, retrieval hit 86% -> 95% — for roughly 1.9x
    # the tokens per query. Returns flatten by 20 and stop entirely past it. Lower it
    # to 5 if cost matters more than accuracy for your questions.
    top_k: 10
    # Neighbouring chunks pulled in either side of each hit, in reading order, so a
    # claim arrives with the sentences that give it meaning. 0 disables it. Raising
    # it multiplies the passages sent to the model, so measure with `eval` first.
    retrieval_window: 0
    # vector = embeddings only. hybrid also runs a BM25 keyword search and fuses the
    # two rankings, which helps where embeddings are weakest: acronyms, author names
    # and exact phrases. Query-time only — switching it needs no re-indexing.
    #
    # hybrid is the default because it measured better on two independent question
    # sets for no extra tokens. It pays off most with top_k >= 10: at top_k 5 roughly
    # half the slots go to each retriever, which can push out a passage the vectors
    # had ranked well. Set `vector` to skip building the keyword index, which costs
    # ~0.2s per 1,000 chunks at start-up.
    retrieval: hybrid

    # Reranking re-scores the retrieved passages against the question with a
    # cross-encoder, then keeps the best top_k. It works on top of any retrieval
    # mode above. null => inherit global.defaults.reranker; `cohere` enables it and
    # requires COHERE_API_KEY.
    reranker: null
    reranker_model: rerank-v4.0-fast
    # Candidates retrieved per final passage: with top_k 10 and fanout 4, 40 passages
    # are retrieved and the best 10 kept. A fanout of 1 would let the reranker only
    # reorder what was already going to be sent, which is close to pointless.
    reranker_fanout: 4

    temperature: 0.0

    # Which attachment wins when an item has several readable ones. Many items
    # hold both a published PDF and an HTML snapshot of the same article; indexing
    # both would embed that content twice and let the copies compete in retrieval.
    # Formats: pdf, docx, odt, epub, html, markdown, txt (plain text, CSV).
    # A transcript made by `convert` and its source are one document: only the
    # copy ranked higher here is indexed. Put `markdown` first to index transcripts.
    attachment_preference: [pdf, docx, odt, epub, html, markdown, txt]
    # true indexes every readable attachment of an item instead of just the best.
    index_all_attachments: false
    # Zotero notes are indexed alongside their item's file, never instead of it.
    index_notes: true

    # null => inherit from global.defaults
    llm_model: null
    embedding_model: null
    vector_db: null

eval:
    # Golden set for `zotero-rag eval`: questions, expected points, and the items
    # a correct answer should cite. Relative paths resolve inside this folder.
    questions_file: questions.yaml
    # null => grade with the same model that answers. Point a stronger model at
    # the grading if you want a second opinion on a cheap answering model.
    judge_model: null
    # Keep this at 0. It does not make the judge fully deterministic — repeat runs
    # reproduce the grades but can move point coverage by a few points — so treat a
    # small coverage difference between two runs as noise, not as a result.
    judge_temperature: 0.0
    # Characters of retrieved context handed to the optional --assess-context
    # pass, so a large top_k cannot overflow the judge's window.
    context_char_budget: 12000

    # `generate-questions`: writes a starting questions.yaml from the indexed
    # documents themselves. null => use the answering model.
    generator_model: null
    questions_per_document: 3
    # Characters of each document shown to the generator. A paper longer than this
    # is sampled head-and-tail, so the conclusions arrive with the abstract.
    document_char_budget: 30000

markdown:
    # When a Markdown transcript counts as faithful to its source file. Only a
    # transcript that passes lets `shrink-storage` trash the original. Calibrated
    # against hand-graded conversions (PRD-markdown.md, Phase 0); a stricter value
    # only means more originals are kept.
    quality:
        min_recall: 0.85 # share of the source's words found in the transcript
        min_worst_segment_recall: 0.80 # the same, for the weakest page: a dropped page
        max_glued_words: 0.02 # 20+ letter "words": lost spaces
        max_garbage_ratio: 0.005 # replacement characters, (cid:NN) codes
        min_letter_ratio: 0.60 # letters among visible characters
        max_broken_spacing: 0.05 # stray single letters: "T h e  r e s u l t s"
        min_baseline_words: 200 # fewer source words than this: unverifiable (scans)
        min_segment_words: 50 # shorter pages are left out of the worst-page check
