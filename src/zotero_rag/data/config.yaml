global:
    # Only the NAMES of the environment variables are stored here; the values are
    # resolved from the environment (or a .env file) at load time.
    endpoint_env: OPENROUTER_ENDPOINT
    api_key_env: OPENROUTER_API_KEY
    zotero_library_id_env: ZOTERO_LIBRARY_ID
    zotero_api_key_env: ZOTERO_API_KEY
    # Only needed for `reranker: cohere`, which calls Cohere's own API. A reranker
    # from the `rerankers` list goes through OpenRouter on the key above.
    cohere_api_key_env: COHERE_API_KEY
    # Optional, for `convert --ocr hosted`, which sends scanned PDF pages to
    # Firecrawl Parse. It works without a key, at lower limits.
    firecrawl_api_key_env: FIRECRAWL_API_KEY
    zotero_library_type: user
    defaults:
        llm_model: openai/gpt-4o-mini
        embedding_model: openai/text-embedding-3-small
        vector_db: chroma
        # null | an OpenRouter reranker id | cohere. Inherited by the index unless
        # it sets its own.
        reranker: null
        # The model that grades `eval` and `compare-embeddings` answers. null =>
        # the answering model (llm_model). A different model, ideally from another
        # provider, avoids a model grading its own answers. eval.judge_model below
        # overrides it for one index folder.
        judge_model: null

index:
    # Pinned by the first `index` run; null in a freshly initialized folder.
    collection_path: null
    collection_key: null
    collection_name: null
    recursive: true

    chunk_size: 1000 # characters
    chunk_overlap: 200 # characters
    # Passages retrieved per question. 10 rather than 5 because every measured metric
    # improved — mean score 1.81 -> 2.38, retrieval hit 86% -> 95% — for roughly 1.9x
    # the tokens per query. Returns flatten by 20 and stop entirely past it. Lower it
    # to 5 if cost matters more than accuracy for your questions.
    top_k: 10
    # Neighbouring chunks pulled in either side of each hit, in reading order, so a
    # claim arrives with the sentences that give it meaning. 0 disables it. Raising
    # it multiplies the passages sent to the model, so measure with `eval` first.
    retrieval_window: 0
    # vector = embeddings only. hybrid also runs a BM25 keyword search and fuses the
    # two rankings, which helps where embeddings are weakest: acronyms, author names
    # and exact phrases. Query-time only — switching it needs no re-indexing.
    #
    # hybrid is the default because it measured better on two independent question
    # sets for no extra tokens. It pays off most with top_k >= 10: at top_k 5 roughly
    # half the slots go to each retriever, which can push out a passage the vectors
    # had ranked well. Set `vector` to skip building the keyword index, which costs
    # ~0.2s per 1,000 chunks at start-up.
    retrieval: hybrid

    # Reranking re-scores the retrieved passages against the question with a
    # cross-encoder, then keeps the best top_k. It works on top of any retrieval
    # mode above. null => inherit global.defaults.reranker. Set it to a reranker id
    # from the `rerankers` list below (e.g. cohere/rerank-4-fast), called through
    # OpenRouter; or to `cohere` for Cohere's own API with reranker_model, which
    # requires COHERE_API_KEY.
    reranker: null
    reranker_model: rerank-v4.0-fast # only for `reranker: cohere`
    # Candidates retrieved per final passage: with top_k 10 and fanout 4, 40 passages
    # are retrieved and the best 10 kept. A fanout of 1 would let the reranker only
    # reorder what was already going to be sent, which is close to pointless.
    reranker_fanout: 4

    temperature: 0.0

    # Which attachment wins when an item has several readable ones. Many items
    # hold both a published PDF and an HTML snapshot of the same article; indexing
    # both would embed that content twice and let the copies compete in retrieval.
    # Formats: markdown, pdf, docx, odt, epub, html, txt (plain text, CSV).
    # A transcript made by `convert` and its source are one document, and only the
    # copy ranked higher here is indexed. `markdown` first indexes transcripts:
    # equal answer quality for ~13% fewer prompt tokens. To index the originals
    # instead, move `markdown` after the formats it transcribes, e.g.
    #   attachment_preference: [pdf, docx, odt, epub, html, markdown, txt]
    attachment_preference: [markdown, pdf, docx, odt, epub, html, txt]
    # true indexes every readable attachment of an item instead of just the best.
    index_all_attachments: false
    # Zotero notes are indexed alongside their item's file, never instead of it.
    index_notes: true

    # null => inherit from global.defaults
    llm_model: null
    embedding_model: null
    vector_db: null

eval:
    # Golden set for `zotero-rag eval`: questions, expected points, and the items
    # a correct answer should cite. Relative paths resolve inside this folder.
    questions_file: questions.yaml
    # null => inherit global.defaults.judge_model, and failing that grade with the
    # model that answers.
    judge_model: null
    # Keep this at 0. It does not make the judge fully deterministic — repeat runs
    # reproduce the grades but can move point coverage by a few points — so treat a
    # small coverage difference between two runs as noise, not as a result.
    judge_temperature: 0.0
    # Characters of retrieved context handed to the optional --assess-context
    # pass, so a large top_k cannot overflow the judge's window.
    context_char_budget: 12000

    # `generate-questions`: writes a starting questions.yaml from the indexed
    # documents themselves. null => use the answering model.
    generator_model: null
    questions_per_document: 3
    # Characters of each document shown to the generator. A paper longer than this
    # is sampled as evenly spaced passages, so the method and results arrive too.
    document_char_budget: 30000

markdown:
    # When a Markdown transcript counts as faithful to its source file. Only a
    # transcript that passes lets `shrink-storage` trash the original. Calibrated
    # against hand-graded conversions (PRD-markdown.md, Phase 0); a stricter value
    # only means more originals are kept.
    quality:
        min_recall: 0.85 # share of the source's words found in the transcript
        min_worst_segment_recall: 0.80 # the same, for the weakest page: a dropped page
        max_glued_words: 0.02 # 20+ letter "words": lost spaces
        max_garbage_ratio: 0.005 # replacement characters, (cid:NN) codes
        min_letter_ratio: 0.60 # letters among visible characters
        max_broken_spacing: 0.05 # stray single letters: "T h e  r e s u l t s"
        min_baseline_words: 200 # fewer source words than this: unverifiable (scans)
        min_segment_words: 50 # shorter pages are left out of the worst-page check

# Candidate embedding models for `compare-embeddings`, which builds one store per
# model and chunk size under embeddings/<model>/<chunk_size>/ and scores each with
# the `eval` question set. Prices turn the token counts into the cost column; a
# model missing from this list can still be compared with --model, just unpriced.
# The configured embedding_model at the configured chunk_size is the baseline and
# is read from chroma/ as-is, never rebuilt.
# Embedding requests carry 100 texts each; a provider that accepts fewer takes a
# `batch_size:` on its entry.
embedding_models:
    - id: perplexity/pplx-embed-v1-0.6b
      provider: Perplexity
      dimensions: 384
      context_window: 32000
      pricing: { currency: USD, unit: per_1M_tokens, input: 0.004 }
      notes: Ultra-low budget vector baseline for extremely fast retrieval.
    - id: qwen/qwen3-embedding-8b
      provider: Alibaba
      dimensions: 4096
      context_window: 32768
      pricing: { currency: USD, unit: per_1M_tokens, input: 0.01 }
      notes: Open-weight model with a large context window and high dimensionality.
    - id: baai/bge-m3
      provider: BAAI
      dimensions: 1024
      context_window: 8192
      pricing: { currency: USD, unit: per_1M_tokens, input: 0.01 }
      notes: Open-source multilingual embedding.
    - id: openai/text-embedding-3-small
      provider: OpenAI
      dimensions: 1536
      context_window: 8191
      pricing: { currency: USD, unit: per_1M_tokens, input: 0.02 }
      notes: The default.
    - id: amazon/titan-embed-text-v2
      provider: Amazon
      dimensions: 1024
      context_window: 8192
      pricing: { currency: USD, unit: per_1M_tokens, input: 0.02 }
      notes: Configurable dimension downscaling (512 or 256).
    - id: voyageai/voyage-4
      provider: Voyage AI
      dimensions: 1024
      context_window: 32000
      pricing: { currency: USD, unit: per_1M_tokens, input: 0.06 }
      notes: Strong retrieval accuracy with a 32k context.
    - id: google/gemini-embedding-001
      provider: Google
      dimensions: 768
      context_window: 20000
      pricing: { currency: USD, unit: per_1M_tokens, input: 0.15 }
      notes: Google's text embedding model.
    - id: nvidia/nemotron-3.5-embed-1b:free
      provider: NVIDIA
      dimensions: 1024
      context_window: 32768
      pricing: { currency: USD, unit: per_1M_tokens, input: 0.00 }
      notes: Rate-limited free tier on OpenRouter.

# Rerankers available on OpenRouter (output modality `rerank`), with their prices.
# Any of these ids can be set as `reranker:` above or passed as --reranker.
# Units differ by provider: Cohere charges per search (one query reranking up to
# 100 documents), the others per million tokens of query plus documents, so which
# is cheaper depends on reranker_fanout and chunk_size. context_window is per
# query+document pair. Prices from openrouter.ai, October 2026.
rerankers:
    - id: cohere/rerank-v3.5
      provider: Cohere
      context_window: 4096
      pricing: { currency: USD, unit: per_search, input: 0.001 }
      notes: Multilingual (100+ languages); the shortest window here.
    - id: cohere/rerank-4-fast
      provider: Cohere
      context_window: 32768
      pricing: { currency: USD, unit: per_search, input: 0.002 }
      notes: Cohere's latency-optimized v4 reranker.
    - id: cohere/rerank-4-pro
      provider: Cohere
      context_window: 32768
      pricing: { currency: USD, unit: per_search, input: 0.0025 }
      notes: Cohere's quality-optimized v4 reranker.
    - id: voyageai/rerank-2.5-lite
      provider: Voyage AI
      context_window: 32000
      pricing: { currency: USD, unit: per_1M_tokens, input: 0.02 }
      notes: Optimized for latency and quality.
    - id: voyageai/rerank-2.5
      provider: Voyage AI
      context_window: 32000
      pricing: { currency: USD, unit: per_1M_tokens, input: 0.05 }
      notes: Optimized for quality.
    - id: voyageai/rerank-3-lite
      provider: Voyage AI
      context_window: 32000
      pricing: { currency: USD, unit: per_1M_tokens, input: 0.02 }
      notes: Drop-in upgrade to rerank-2.5-lite.
    - id: voyageai/rerank-3
      provider: Voyage AI
      context_window: 32000
      pricing: { currency: USD, unit: per_1M_tokens, input: 0.05 }
      notes: Drop-in upgrade to rerank-2.5.
    - id: qwen/qwen3-reranker-8b
      provider: Alibaba
      context_window: 40960
      pricing: { currency: USD, unit: per_1M_tokens, input: 0.20 }
      notes: Open-weight reranker built on Qwen3.
    - id: nvidia/nemotron-3.5-rerank-8b:free
      provider: NVIDIA
      context_window: 32768
      pricing: { currency: USD, unit: per_1M_tokens, input: 0.00 }
      notes: Rate-limited free tier on OpenRouter; accepts text and images.
    - id: nvidia/llama-nemotron-rerank-vl-1b-v2:free
      provider: NVIDIA
      context_window: 10240
      pricing: { currency: USD, unit: per_1M_tokens, input: 0.00 }
      notes: Rate-limited free tier; multimodal, built for document images.
